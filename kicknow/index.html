<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KickNow">
  <meta name="theme-color" content="#F5F7F4">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KickNow – Fußballplätze in München</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=6">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css?v=6">
  <link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>
  <div id="app">
    <main id="tabs-layer">
      <section class="tab-screen" id="tab-karte" data-tab="karte"></section>
      <section class="tab-screen" id="tab-liste" data-tab="liste"></section>
      <section class="tab-screen" id="tab-anmelden" data-tab="anmelden"></section>
      <section class="tab-screen" id="tab-profil" data-tab="profil"></section>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
    <div id="push-layer"></div>
    <div id="sheet-layer"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <div id="splash">
      <img src="assets/logo.svg" alt="" class="splash-logo">
      <div class="splash-word">Kick<span>Now</span></div>
      <p>Find a pitch. Start a game.</p>
    </div>
  </div>

  <!-- Fallback & Modern Vector Map Libraries -->
  <script src="vendor/leaflet/leaflet.js?v=6"></script>
  <script src="vendor/maplibre/maplibre-gl.js?v=6"></script>
  <script src="vendor/maplibre/kicknow-style.js?v=6"></script>
  <script src="js/data.js?v=6"></script>
  <script src="js/art.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
